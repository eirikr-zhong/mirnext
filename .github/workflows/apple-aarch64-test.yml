name: MIRNext Apple aarch64 test

on: [push, workflow_dispatch]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: macos-15
    
    steps:
    - uses: actions/checkout@v4
    - name: Build and test native core with independent C oracle
      run: |
        cmake -S . -B build -DMIRNEXT_BUILD_C_REFERENCE=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMIRNEXT_TEST_EXPECTED_TARGET=aarch64-macos
        cmake --build build --parallel 2
        ctest --test-dir build --output-on-failure --parallel 4 --output-junit "${{ github.workspace }}/build/native-tests.xml"
        cmake --build build --config ${{ matrix.build_type }} --target mirnext_check_native_evidence --parallel 2
    - name: Build and test standalone MIR core
      run: |
        cmake -S . -B build-core -DMIRNEXT_BUILD_C_REFERENCE=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMIRNEXT_TEST_EXPECTED_TARGET=aarch64-macos
        cmake --build build-core --parallel 2
        ctest --test-dir build-core --output-on-failure --parallel 4 --output-junit "${{ github.workspace }}/build-core/native-tests.xml"
        cmake --build build-core --config ${{ matrix.build_type }} --target mirnext_check_native_evidence --parallel 2
    - name: Build without tests or examples
      if: matrix.build_type == 'Release'
      run: |
        cmake -S . -B build-no-tests -DMIRNEXT_BUILD_C_REFERENCE=OFF -DBUILD_TESTING=OFF -DMIRNEXT_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
        cmake --build build-no-tests --parallel 2
    - name: Verify external CMake consumers
      run: |
        cmake -S cmake/consumer-smoke -B build-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build build-consumer --config ${{ matrix.build_type }} --parallel 2
        ctest --test-dir build-consumer -C ${{ matrix.build_type }} --output-on-failure --parallel 4
    - name: Verify installed native C++ layers
      run: |
        cmake --install build-core --config ${{ matrix.build_type }} --prefix "${{ github.workspace }}/install-core-stage"
        cmake -E rename "${{ github.workspace }}/install-core-stage" "${{ github.workspace }}/install-core"
        cmake -S tests/Consumer -B build-native-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-core"
        cmake --build build-native-consumer --config ${{ matrix.build_type }} --parallel 2
        ctest --test-dir build-native-consumer -C ${{ matrix.build_type }} --output-on-failure --parallel 4
    - name: Verify GNU make native package
      if: matrix.build_type == 'Release' && runner.os != 'Windows'
      run: |
        make -j8 NATIVE_BINARY_DIR=build-no-tests
        make install NATIVE_BINARY_DIR=build-no-tests PREFIX="${{ github.workspace }}/install-make"
        cmake -S tests/Consumer -B build-make-consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-make"
        cmake --build build-make-consumer --config Release --parallel 2
        ctest --test-dir build-make-consumer -C Release --output-on-failure --parallel 4
        make uninstall NATIVE_BINARY_DIR=build-no-tests
    - name: Preserve native acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-aarch64-macos-${{ matrix.build_type }}
        path: |
          build*/native-acceptance-*.json*
          build*/native-test-manifest-*.json
          build*/native-evidence-*.json
          build*/native-tests.xml
          build*/Testing/Temporary/LastTest.log
