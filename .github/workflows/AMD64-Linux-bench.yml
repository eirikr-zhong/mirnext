name: MIRNext x86_64 Linux macOS bench

on: [workflow_dispatch]
#  schedule:
#    # Run at 18:00 UTC on Wednesday
#    - cron:  '00 18 * * 3'

jobs:
  bench:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    - name: Build and run native benchmarks
      run: |
        cmake -S . -B build-benchmarks -DBUILD_TESTING=OFF -DMIRNEXT_BUILD_EXAMPLES=OFF -DMIRNEXT_BUILD_UTILITIES=OFF -DMIRNEXT_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build build-benchmarks --target mirnext_classic_benchmark mirnext_format_io_benchmark --parallel 2
        python3 benchmarks/Run.py --build build-benchmarks
