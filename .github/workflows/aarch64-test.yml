name: MIRNext aarch64 Linux test

on: [push, workflow_dispatch]

jobs:
  aarch64_job:
    # The host should always be Linux
    runs-on: [self-hosted, linux, ARM64]
    name: Build on gcc117 aarch64
    steps:
    - uses: actions/checkout@v4
    - name: make test
      run: |
         uname -a
         make test
